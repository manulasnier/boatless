version: 2

updates:
  # boatless ships LESS sources and declares no runtime dependency, so every
  # package here is build tooling that never reaches consumers. Routine bumps
  # are grouped into one PR to keep the noise proportional to that stake.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps)
    groups:
      build-toolchain:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The workflows pin actions to exact versions, which only stays current if
  # something keeps them moving
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
