name: Notify boatless-doc

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger boatless-doc rebuild
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ secrets.DOC_DEPLOY_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'manulasnier',
              repo: 'boatless-doc',
              event_type: 'boatless-updated',
            });
