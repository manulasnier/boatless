name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Node 24 already bundles a recent npm, but trusted publishing needs
      # >= 11.5.1 to exchange the OIDC token, so pull it forward explicitly
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - name: Install dependencies
        run: npm ci

      # A tag must describe the version it ships, otherwise the release is a lie
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Compiles the LESS and runs Stylelint, which fails the build on error
      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
